# Reference score -- J. S. Bach, Invention No. 13 in A minor,
# BWV 784, bars 1-17, as bach.bas plays them.
#
# Written from the note data bach.bas holds (both files come out of one
# parse of the Mutopia LilyPond source) and from the player's own write
# schedule, before any capture existed to read.
#
# NTSC session: clock 1022727 Hz, 60 fps.  One sixteenth is
# 8 frames, so a quarter is 32 frames = 0.533 s (crotchet = 112.5).
#
# Why every new note is one frame of rest and seven of tone: the player
# drops a voice's gate in one frame and raises it in the next, so the
# once-per-frame sampler sees the release.  A tie or a note longer than
# a sixteenth keeps the gate up and shows no rest, and two equal pitches
# in a row merge -- the transcriber divides on pitch, not on the gate.
#
# Voice 3 is the noise track: one hit a beat, gate up for one sixteenth
# and down for three.  Its note names are only what its frequency
# register works out to -- noise has brightness, not pitch.
#
# The leading and trailing rests are left out: the window opens in the
# program's silent lead-in and closes after the last gate-off, and
# diff_score exempts an unscored rest at either end.
tempo_frames_per_row: 8
