# La Galaxia -- four lasers taking voice 1 off the theme, and giving it back
# The laser (priority 2) seizes voice 1 from the sequencer at music frames
# 60, 120, 180, 240, holds it for five frames of sweep and one of
# gate-off, then hands it back.  The sequencer never stopped: every note
# after a seizure is the one it would have been playing had the laser never
# fired, at the frame it would have been playing it -- which is the whole
# of the resume half of the priority rule, and is what this score checks.
# Voices 2 and 3 carry on untouched, which is the other half: a seizure
# takes one voice, not the player
# GENERATED by tools/genmusic.py from the same note data music.inc
# carries -- a reference score written from a transcription cannot
# fail, and a check that cannot fail is not evidence.
# rows 0..43 (44 rows, 264 frames)
