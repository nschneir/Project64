# Written from the sequencer tables in sound.s, not from the
# transcription -- a score pasted back from a capture passes by
# construction, with whatever the player got wrong baked in as the
# specification.  Durations are omitted on purpose: the tick is paced
# on the jiffy clock, which drifts a frame over a few hundred, so the
# claim here is the note sequence, one entry per sequencer event
# after consecutive equal pitches merge.
#
# During play the lead voice belongs to the effects that have not fired
# in this window, so an empty list is the claim: nothing stole it.  The
# other two voices carry the siren sweep and the dot-munch alternation,
# whose pitches are deliberately not a tune -- they are left unscored and
# read off the piano roll instead.
tempo_frames_per_row: 8
voices:
  1: []
