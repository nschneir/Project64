# Reference score for the live arpeggio fixture in tests/test_audio.py.
#
# PAL values throughout: the fixture runs on a `c64pal` session, and the
# register values it writes (4455 / 5613 / 6685) are C4 / E4 / G4 only at the
# PAL clock. The same registers on an NTSC machine sound 65 cents flat and
# transcribe as C#4 / F4 / G#4 — which is what makes this file a real check
# rather than a rubber stamp.
#
# Voice 1's first event has no `frames`: the fixture is already sounding C4
# when the capture starts (a capture that opens on silence would shift every
# later slot and cascade a false diff down the whole voice), so how much of
# that C4 is caught depends on how long `capture()` takes to arm. E4 and G4
# are whole notes the fixture times itself against the raster, so their
# lengths are pinned. The capture window ends inside the fixture's closing
# silence, which `diff_score` exempts as the end of the window rather than a
# mistake — a score need not predict its own trailing rest.
voices:
  1:
    - {note: C4}
    - {note: E4, frames: 50}
    - {note: G4, frames: 50}
  2: []
  3: []
