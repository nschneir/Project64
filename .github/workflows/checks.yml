name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Type checking only, by decision. The test suite needs VICE (`x64sc`,
  # `c1541`) and we don't expect emulators to run on GitHub, so tests are
  # validated locally by whoever makes the change — see AGENTS.md. Please
  # don't add a pytest step here; pyright is here because it is pure static
  # analysis and needs nothing installed but the project's own dependencies.
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 3.13 to match the development venv: a checker run against a different
      # interpreter version can disagree about stdlib signatures, and a gate
      # that is red only on the runner teaches everyone to ignore it.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # pyright resolves imports through `[tool.pyright]`'s venvPath/venv
      # (`./.venv`), so the venv has to exist and carry both the runtime and
      # the dev dependencies — without it every third-party import reads as
      # missing and the check fails on ~70 phantom errors.
      - name: Create the project venv
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet -e ".[dev]"

      # Pinned on purpose: pyright is not a project dependency (it drags in a
      # Node toolchain — AGENTS.md), and an unpinned checker means one of its
      # releases can turn this red without a line of our code changing. Bump
      # it deliberately, with the tree clean before and after.
      - name: Type check
        run: |
          npm install -g pyright@1.1.411
          pyright
